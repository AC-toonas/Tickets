<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <!-- Navigation links go here -->
        </nav>
    </header>

    <main>
        <h1 id="Title">Purchase a Ticket!</h1>
        <form>
            <div class="Form">
                <div>
                    <label>Name:</label>
                    <input type="text" class="input" name="Name" placeholder="Your name" required>
                </div>

                <div>
                    <label>(Not Required) Phone Number:</label>
                    <input type="number" class="input" name="Number" placeholder="Your phone number">
                </div>

                <div>
                    <label>Email:</label>
                    <input type="email" class="input" name="Email" placeholder="Your email" required>
                </div>

                <div>
                    <label>Ticket / Pass name:</label>
                    <input type="text" class="input" name="Ticket" placeholder="Your ticket/pass name" required>
                </div>

                <div>
                    <label>Date of visit:</label>
                    <input type="date" class="input" name="Date" placeholder="Date of visit" required>
                </div>
                <button type="submit" id="submit" class="btn">Submit</button>
            </div>
            
        </form>
    </main>

    <footer>
        <p>&copy; Paddington Park est 26</p>
    </footer>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
